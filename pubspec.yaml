name: super_library
description: SuperLibrary - Premium Library Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Backend
  supabase_flutter: ^2.5.6
  http: ^1.2.1

  # Payments
  razorpay_flutter: ^1.3.7

  # Utils
  intl: ^0.19.0
  mobile_scanner: ^7.0.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
